name: ovn-kubernetes
summary: Rock for the OVN-Kubernetes CNI.
description: This rock is a drop in replacement for the ovn-kubernetes/ovn-kube-ubuntu image.
version: "1.4.0"
license: Apache-2.0

base: ubuntu@26.04
build-base: ubuntu@26.04
platforms:
  amd64:
  arm64:

parts:
  tools:
    plugin: nil
    stage-packages:
      - iproute2
      - curl
      - software-properties-common
      - util-linux
      - nftables
      - libmnl0
      - ca-certificates
      - gpg
      - ndisc6
      - libndp-tools
      - tcpdump

  ovn:
    plugin: nil
    stage-packages:
      - ovn-central
      - ovn-common
      - ovn-host

  ovs:
    plugin: nil
    stage-packages:
      - openvswitch-switch
      - openvswitch-common
      - openvswitch-test
    override-prime: |
      ln -sf /usr/lib/openvswitch-switch/ovs-vswitchd usr/bin/ovs-vswitchd

  kubectl:
    plugin: nil
    build-packages:
      - ca-certificates
      - curl
      - gpg
    override-build: |
      KUBECTL_MINOR=1.36
      kubectl_apt_signing_fingerprint=DE15B14486CD377B9E876E1A234654DA9A296436
      kubectl_key=/tmp/kubernetes-apt-keyring.asc
      curl -fsSL "https://pkgs.k8s.io/core:/stable:/v${KUBECTL_MINOR}/deb/Release.key" -o "${kubectl_key}"
      test "$(gpg --show-keys --with-colons "${kubectl_key}" | awk -F: '/^fpr:/ {print $10; exit}')" = "${kubectl_apt_signing_fingerprint}"
      mkdir -p /etc/apt/keyrings
      gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg "${kubectl_key}"
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v${KUBECTL_MINOR}/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
      apt-get update
      apt-get download kubectl
      dpkg-deb -x kubectl_*.deb $CRAFT_PART_INSTALL
  
  ovn-kubernetes:
    plugin: make
    source: https://github.com/ovn-kubernetes/ovn-kubernetes.git
    source-tag: v1.4.0
    build-snaps:
      - go/1.26/stable
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cd go-controller
      CGO_ENABLED=0 GOOS=linux GOARCH=$CRAFT_ARCH_BUILD_FOR LDFLAGS= make

      # Note: make install does not install all files, they are instead copied like in the reference Dockerfile
      OUT_DIR=$CRAFT_PART_BUILD/go-controller/_output/go/bin
      OVNKUBE_BINARIES=(
        ovnkube
        ovn-kube-util
        hybrid-overlay-node
        ovnkube-identity
        ovnkube-observ
      )
      for binary in "${OVNKUBE_BINARIES[@]}"; do
        install -D -m 0755 $OUT_DIR/$binary $CRAFT_PART_INSTALL/usr/bin/$binary
      done

      install -D -m 0755 $OUT_DIR/ovn-k8s-cni-overlay $CRAFT_PART_INSTALL/usr/libexec/cni/ovn-k8s-cni-overlay

      DIST_DIR=$CRAFT_PART_BUILD/dist/images
      install -D -m 0755 $DIST_DIR/ovnkube.sh $CRAFT_PART_INSTALL/root/ovnkube.sh

      IPTABLES_SCRIPTS_DIR="$CRAFT_PART_BUILD/dist/images/iptables-scripts"
      IPTABLES_SCRIPTS=(
        iptables
        iptables-restore
        iptables-save
        ip6tables
        ip6tables-restore
        ip6tables-save
      )
      for script in "${IPTABLES_SCRIPTS[@]}"; do
        install -D -m 0755 $IPTABLES_SCRIPTS_DIR/$script $CRAFT_PART_INSTALL/usr/sbin/$script
      done

      install -D -m 0644 $DIST_DIR/ovn_k8s.conf $CRAFT_PART_INSTALL/etc/openvswitch/ovn_k8s.conf

      install -d $CRAFT_PART_INSTALL/usr/share/licenses/ovn-kubernetes
      cp -R $CRAFT_PART_BUILD/LICENSES/. $CRAFT_PART_INSTALL/usr/share/licenses/ovn-kubernetes/

      BRANCH=$(git rev-parse --symbolic-full-name HEAD)
      COMMIT=$(git rev-parse HEAD)
      echo "ref: ${BRANCH}  commit: ${COMMIT}" > $CRAFT_PART_INSTALL/root/git_info
